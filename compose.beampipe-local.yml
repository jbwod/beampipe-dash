# Overlay for Dash on the same Docker engine as Core.
# `scripts/install.sh` and `beampipe setup --dashboard` replace `name:` with the
# live Core network (operator installs are usually `beampipe_default`; a git
# checkout compose project is often `beampipe-core-v2_default`).
services:
  dashboard:
    environment:
      BEAMPIPE_API_URL: http://api:8080
    ports: !override
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - beampipe-core

networks:
  beampipe-core:
    external: true
    name: beampipe-core-v2_default
